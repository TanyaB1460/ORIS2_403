services:

  nats:
    image: nats:latest
    container_name: nats-server
    ports:
      - "4223:4222"
      - "8223:8222"
    command: ["--http_port", "8222"]

  weather-publisher:
    build:
      context: ./weather-publisher
    container_name: weather-publisher
    environment:
      NATS_URL: nats://nats:4222
    depends_on:
      - nats
    restart: on-failure
