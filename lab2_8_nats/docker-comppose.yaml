version: '3.8'

services:
  nats:
    image: nats:latest
    ports:
      - "4222:4222"
    networks:
      - weather-net

  weather-publisher:
    build:
      context: .
      dockerfile: Dockerfile.publisher
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222
    networks:
      - weather-net

  weather-app:
    build:
      context: .
      dockerfile: Dockerfile.app
    ports:
      - "8090:8090"
    depends_on:
      - nats
    environment:
      - NATS_URL=nats://nats:4222
    networks:
      - weather-net

networks:
  weather-net:
    driver: bridge